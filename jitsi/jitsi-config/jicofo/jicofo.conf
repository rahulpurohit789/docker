





jicofo {
    
    authentication {
      enabled = true
      // The type of authentication. Supported values are XMPP, JWT or SHIBBOLETH (default).
      
      type = XMPP
      
      
      login-url = "localhost"
      
      enable-auto-login=true
    }
    

    // Configuration related to jitsi-videobridge
    bridge {
      

      

      

      

      

      brewery-jid = "jvbbrewery@internal-muc.localhost"
    }
    // Configure the codecs and RTP extensions to be used in the offer sent to clients.
    codec {
      video {
        
        
        
      }
    }

    conference {
      

      

      
    }

    
    // Configuration for the internal health checks performed by jicofo.
    health {
      // Whether to perform health checks.
      enabled = true
    }
    

    

    
    jigasi {
      brewery-jid = "jigasibrewery@internal-muc.localhost"
    }
    

    octo {
      // Whether or not to use Octo. Note that when enabled, its use will be determined by
      // $jicofo.bridge.selection-strategy. There's a corresponding flag in the JVB and these
      // two MUST be in sync (otherwise bridges will crash because they won't know how to
      // deal with octo channels).
      enabled = false

      id = "1"
    }

    sctp {
      enabled = false
    }

    xmpp {
      client {
        enabled = true
        hostname = "prosody"
        port = "5222"
        domain = "auth.localhost"
        username = "focus"
        password = "8edf0d4b3c2bb7ac51c1c3cf5457db52"
        conference-muc-jid = "muc.meet.jitsi"
        client-proxy = "focus.localhost"
        disable-certificate-verification = true
      }
      
    }
}
